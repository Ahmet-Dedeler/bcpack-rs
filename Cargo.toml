[package]
name = "bcpack-rs"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Decoder for Xbox Series BCPack (MDU rANS) BC1 texture streams"
repository = "https://github.com/Ahmet-Dedeler/bcpack-rs"
include = ["src/**", "data/**", "python/**", "docs/**", "tests/**", "tools/**", "README.md", "THIRD_PARTY_NOTICES.md", "LICENSE-*"]

[lib]
name = "bcpack"
path = "src/lib.rs"

[[bin]]
name = "bcpack"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# RDS5 (.ttpf) store reader, Gfx10 detiling, whole-texture decode and PNG output.
ttpf = ["dep:flate2", "dep:png"]
# The `bcpack` command-line tool.
cli = ["ttpf", "dep:rayon"]

[dependencies]
flate2 = { version = "1.1", optional = true }
png = { version = "0.18", optional = true }
rayon = { version = "1.10", optional = true }
serde_json = "1.0"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
